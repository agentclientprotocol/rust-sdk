[workspace]
git_release_type = "auto"
git_release_latest = false

# Only release when merging the release PR (avoids race conditions with squash-merge)
release_always = false

# Keep dependencies updated in Cargo.lock
dependencies_update = true

# Tag release PRs for visibility
pr_labels = ["release"]

# Override the default tag format for the original crate to preserve existing tag history
[[package]]
name = "agent-client-protocol"
git_tag_name = "v{{ version }}"
git_release_latest = true
version_group = "acp"

[[package]]
name = "agent-client-protocol-http"
version_group = "acp"

[[package]]
name = "agent-client-protocol-derive"
version_group = "acp"

[[package]]
name = "agent-client-protocol-polyfill"
version_group = "acp"

# This crate publicly exposes ACP types, so every major ACP release already
# forces a major release here. Versioning it separately from the other ACP
# crates only confused users, so keep it in the `acp` version group. Each
# supported rmcp major version has its own feature and module (`rmcp_3`), so a
# new rmcp major version arrives as a new feature in a minor release. Only
# dropping an rmcp major version is breaking; ship it in an ACP major release.
[[package]]
name = "agent-client-protocol-rmcp"
version_group = "acp"

[[package]]
name = "agent-client-protocol-conductor"
version_group = "acp"

[[package]]
name = "agent-client-protocol-test"
version_group = "acp"
publish = false

[[package]]
name = "agent-client-protocol-trace-viewer"
version_group = "acp"

[[package]]
name = "agent-client-protocol-yopo"
version_group = "acp"
publish = false

[[package]]
name = "agent-client-protocol-cookbook"
version_group = "acp"
