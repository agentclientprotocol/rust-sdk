[package]
name = "agent-client-protocol-conductor"
version = "3.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Conductor for orchestrating Agent Client Protocol proxy chains"
keywords = ["acp", "agent", "conductor", "ai"]
categories = ["development-tools"]

[[bin]]
name = "agent-client-protocol-conductor"
path = "src/main.rs"

[features]
default = []
unstable_protocol_v2 = [
    "agent-client-protocol/unstable_protocol_v2",
    "agent-client-protocol-polyfill/unstable_protocol_v2",
]

[dependencies]
agent-client-protocol = { workspace = true, features = ["process", "stdio", "unstable_mcp_over_acp"] }
agent-client-protocol-trace-viewer.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
strip-ansi-escapes.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
agent-client-protocol = { workspace = true, features = ["schemars"] }
agent-client-protocol-polyfill.workspace = true
agent-client-protocol-rmcp = { workspace = true, features = ["unstable_mcp_over_acp"] }
agent-client-protocol-test.workspace = true
yopo.workspace = true
expect-test.workspace = true
regex.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "server",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
