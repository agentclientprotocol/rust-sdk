[package]
name = "agent-client-protocol-conductor"
version = "3.6.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conductor for orchestrating Agent Client Protocol proxy chains"
keywords = ["acp", "agent", "conductor", "ai"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "agent-client-protocol-conductor"
path = "src/main.rs"

# Skipped unless the polyfill's own v2 feature is enabled too, as
# `cargo test --workspace --all-features` does.
[[test]]
name = "mcp_over_acp_polyfill_v2"
required-features = ["unstable_protocol_v2", "agent-client-protocol-polyfill/unstable_protocol_v2"]

[features]
default = []
# The polyfill is a separate crate: enable its own `unstable_protocol_v2`
# feature to use it in a v2 chain.
unstable_protocol_v2 = ["agent-client-protocol/unstable_protocol_v2"]

[dependencies]
agent-client-protocol = { workspace = true, features = ["process", "stdio", "unstable_mcp_over_acp"] }
agent-client-protocol-trace-viewer.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
strip-ansi-escapes.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
agent-client-protocol = { workspace = true, features = ["schemars"] }
agent-client-protocol-polyfill.workspace = true
agent-client-protocol-rmcp = { workspace = true, features = ["rmcp_3", "unstable_mcp_over_acp"] }
agent-client-protocol-test.workspace = true
yopo.workspace = true
expect-test.workspace = true
regex.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "server",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
schemars.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
