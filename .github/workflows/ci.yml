name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml)"
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          target: wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown

      - name: Check with MSRV
        run: |
          cargo check --workspace --all-targets --all-features --locked
          # Keep default checks separate: rmcp enables schemars on the core.
          # Preview 2 covers defaults (rmcp has no default rmcp version, so
          # select `rmcp_3`); check the full surface on both WASI targets.
          cargo check -p agent-client-protocol --lib --target wasm32-wasip2 --locked
          cargo check -p agent-client-protocol-rmcp --lib --target wasm32-wasip2 --features rmcp_3 --locked
          cargo check -p agent-client-protocol -p agent-client-protocol-rmcp --lib --target wasm32-wasip1 --all-features --locked
          cargo check -p agent-client-protocol -p agent-client-protocol-rmcp --lib --target wasm32-wasip2 --all-features --locked
          cargo check -p agent-client-protocol --lib --target wasm32-unknown-unknown --features wasm_js --locked
          cargo check -p agent-client-protocol --lib --target wasm32-unknown-unknown --all-features --locked

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: nightly,stable
          components: rustfmt,clippy
          target: wasm32-wasip1,wasm32-wasip2,wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check for typos
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85
        with:
          config: ./typos.toml

      - name: Check opt-in dependency features
        shell: bash
        run: |
          # Dev dependencies intentionally use native I/O and schemars.
          # Inspect the library graph without their feature unification.
          for features in "" "unstable,unstable_protocol_v2"; do
            dependencies="$(cargo tree -p agent-client-protocol --features "$features" --locked --edges normal,build --prefix none --format '{p}')"
            if grep -Eq '^(schemars(_derive)?|async-process|async-io|blocking|shell-words|rustix) ' <<< "$dependencies"; then
              printf '%s\n' "$dependencies" >&2
              echo "native I/O and schemars must remain opt-in" >&2
              exit 1
            fi
          done
          dependencies="$(cargo tree -p agent-client-protocol --features schemars --locked --edges normal,build --prefix none --format '{p}')"
          if ! grep -Eq '^schemars ' <<< "$dependencies"; then
            echo "the schemars feature must enable JSON Schema generation" >&2
            exit 1
          fi
          dependencies="$(cargo tree -p agent-client-protocol --features stdio --locked --edges normal,build --prefix none --format '{p}')"
          if ! grep -Eq '^blocking ' <<< "$dependencies" || grep -Eq '^(async-process|async-io|shell-words|schemars) ' <<< "$dependencies"; then
            echo "stdio must enable blocking I/O without subprocess or schema support" >&2
            exit 1
          fi
          dependencies="$(cargo tree -p agent-client-protocol --features process --locked --edges normal,build --prefix none --format '{p}')"
          if ! grep -Eq '^async-process ' <<< "$dependencies" || grep -Eq '^(blocking|schemars) ' <<< "$dependencies"; then
            echo "process must enable subprocess support without stdio or schema support" >&2
            exit 1
          fi

      - name: Lint
        run: |
          cargo clippy
          cargo clippy --all-targets --all-features
          cargo clippy -p agent-client-protocol -p agent-client-protocol-rmcp --lib --target wasm32-wasip1 --all-features -- -D warnings
          cargo clippy -p agent-client-protocol -p agent-client-protocol-rmcp --lib --target wasm32-wasip2 --all-features -- -D warnings
          cargo clippy -p agent-client-protocol --lib --target wasm32-unknown-unknown --all-features -- -D warnings

      - name: Check docs.rs build
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: >-
          cargo +nightly doc --all-features --no-deps --locked
          -p agent-client-protocol
          -p agent-client-protocol-cookbook
          -p agent-client-protocol-conductor
          -p agent-client-protocol-derive
          -p agent-client-protocol-http
          -p agent-client-protocol-polyfill
          -p agent-client-protocol-rmcp
          -p agent-client-protocol-trace-viewer

      - name: Check WASI documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc -p agent-client-protocol --lib --target wasm32-wasip2 --all-features --no-deps --locked

      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: just

      - name: Run tests
        # prep-tests builds ordinary binaries/examples once; test builds and runs
        # the remaining library, binary, integration, example, and doc tests.
        run: just test

  feature-powerset:
    name: Feature powerset (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition:
          - "1/8"
          - "2/8"
          - "3/8"
          - "4/8"
          - "5/8"
          - "6/8"
          - "7/8"
          - "8/8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          toolchain: stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2
        with:
          tool: cargo-hack

      - name: Check feature powerset
        # `default` and `unstable` are aggregate aliases, and `wasm_js` is
        # covered on its relevant target above. Excluding them avoids duplicate
        # or host-only combinations; `schemars` is checked independently.
        # Depth 2 covers every remaining individual feature and pair, while the
        # regular CI all-features tests cover their full union without making
        # this matrix grow exponentially.
        env:
          # `--no-dev-deps` removes dev-dependencies from the manifests while
          # cargo-hack runs. Cargo then reports the workspace dependencies that
          # only dev-dependencies inherit as unused, and denying all warnings
          # would fail every combination. Deny compiler warnings only. The
          # Build job still denies Cargo's warnings for the real manifests.
          CARGO_BUILD_WARNINGS: warn
          RUSTFLAGS: -D warnings
        run: cargo hack check --workspace --feature-powerset --depth 2 --exclude-features default,unstable,wasm_js --no-dev-deps --partition ${{ matrix.partition }}
